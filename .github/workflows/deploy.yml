name: Deploy pelindomarine.com

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-pelindomarine.com
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          envs: GH_TOKEN,GIT_SHA
          script: |
            GH_TOKEN="${GH_TOKEN}" GIT_SHA="${GIT_SHA}" /opt/deploy/deploy.sh pelindomarine.com
